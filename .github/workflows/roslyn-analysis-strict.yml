name: Roslyn analysis (strict)

on:
  workflow_dispatch:

jobs:
  strict-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Losetta.sln

      - name: Build (treat warnings as errors)
        run: dotnet build Losetta.sln --no-restore -p:TreatWarningsAsErrors=true -v minimal
